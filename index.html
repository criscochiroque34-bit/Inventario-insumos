function AreaTab({salidas,products,areaColors}){
  const [periodo,setPeriodo]=useState('30');
  const [filProd,setFilProd]=useState('');
  const [filtroArea,setFiltroArea]=useState('todos');
  
  const hoy=new Date();
  const diasPeriodo=periodo==='all'?9999:parseInt(periodo);
  const desde=new Date(hoy);desde.setDate(desde.getDate()-diasPeriodo);
  const desdeAnt=new Date(desde);desdeAnt.setDate(desdeAnt.getDate()-diasPeriodo);
  
  // Filtrar salidas aprobadas del período actual
  const salAprob=salidas.filter(s=>s.status==='approved'&&s.area);
  const salPeriodo=salAprob.filter(s=>new Date(s.fecha)>=desde);
  const salPeriodoAnt=salAprob.filter(s=>{const f=new Date(s.fecha);return f>=desdeAnt&&f<desde;});
  
  const areasDB=[...new Set(salAprob.map(s=>s.area).filter(Boolean))];
  const areasTodas=[...new Set(['XD','IL',...areasDB])].sort();
  const areas=filtroArea==='todos'?areasTodas:areasTodas.filter(a=>a===filtroArea);
  
  // Cálculos
  const consumoArea=(arr,area)=>arr.filter(s=>s.area===area).reduce((t,s)=>t+s.cantidad,0);
  const promedioDiario=(area)=>{
    const total=consumoArea(salPeriodo,area);
    const dias=Math.min(diasPeriodo,Math.max(1,Math.round((hoy-new Date(salPeriodo[salPeriodo.length-1]?.fecha||hoy))/(1000*60*60*24))+1));
    return diasPeriodo===9999?Math.round(total/Math.max(dias,1)*10)/10:Math.round(total/diasPeriodo*10)/10;
  };
  const tendencia=(area)=>{
    const act=consumoArea(salPeriodo,area);
    const ant=consumoArea(salPeriodoAnt,area);
    if(ant===0)return act>0?100:0;
    return Math.round(((act-ant)/ant)*100);
  };
  const totalPeriodo=areas.reduce((t,a)=>t+consumoArea(salPeriodo,a),0);
  
  // Productos exclusivos
  const productosArea=(area)=>new Set(salPeriodo.filter(s=>s.area===area).map(s=>s.product_id));
  const productosOtras=(area)=>new Set(salPeriodo.filter(s=>s.area!==area).map(s=>s.product_id));
  const exclusivos=(area)=>{const otras=productosOtras(area);return [...productosArea(area)].filter(pid=>!otras.has(pid)).map(pid=>products.find(p=>p.id===pid)).filter(Boolean);};
  
  // Evolución por mes (últimos 6 meses)
  const mesesEvo=[];
  for(let i=5;i>=0;i--){
    const d=new Date(hoy);d.setMonth(d.getMonth()-i);
    const mes=d.getMonth(),ano=d.getFullYear();
    const label=d.toLocaleDateString('es',{month:'short'});
    const datos={mes:label};
    areas.forEach(a=>{
      datos[a]=salAprob.filter(s=>{const f=new Date(s.fecha);return f.getMonth()===mes&&f.getFullYear()===ano&&s.area===a;}).reduce((t,s)=>t+s.cantidad,0);
    });
    mesesEvo.push(datos);
  }
  const maxMes=Math.max(...mesesEvo.map(m=>Math.max(...areas.map(a=>m[a]||0))),1);
  
  // Consumo por producto y area con filtro
  const consumoProdArea=(area,pid)=>salPeriodo.filter(s=>s.area===area&&s.product_id===pid).reduce((t,s)=>t+s.cantidad,0);
  const consumoAreaPorProd=(area)=>products.map(p=>({n:p.nombre,id:p.id,v:consumoProdArea(area,p.id)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const top5=(area)=>consumoAreaPorProd(area).slice(0,5);
  
  return <>
    {/* FILTRO DE ÁREA */}
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:'1rem',flexWrap:'wrap'}}>
      <span style={{fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',color:'var(--text2)',marginRight:4}}>Área</span>
      <button className={`tab${filtroArea==='todos'?' on':''}`} onClick={()=>setFiltroArea('todos')}>Ambos</button>
      {areasTodas.map((a,i)=><button key={a} className={`tab${filtroArea===a?' on':''}`} onClick={()=>setFiltroArea(a)} style={filtroArea===a?{borderLeft:`3px solid ${areaColors[areasTodas.indexOf(a)%areaColors.length]}`}:{}}>{a}</button>)}
    </div>
    {/* FILTRO DE PERÍODO */}
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:'1.25rem',flexWrap:'wrap'}}>
      <label style={{fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',color:'var(--text2)'}}>Período</label>
      <select value={periodo} onChange={e=>setPeriodo(e.target.value)} style={{minWidth:160,width:'auto'}}>
        <option value="7">Últimos 7 días</option>
        <option value="30">Últimos 30 días</option>
        <option value="90">Últimos 90 días</option>
        <option value="all">Todo el tiempo</option>
      </select>
      <span style={{fontSize:11,color:'var(--text3)'}}>· {salPeriodo.length} movimientos</span>
    </div>
    
    {/* MÉTRICAS PRINCIPALES */}
    <div style={{display:'grid',gridTemplateColumns:`repeat(${Math.min(areas.length+1,4)},minmax(0,1fr))`,gap:10,marginBottom:'1.25rem'}}>
      {areas.map((a,i)=>{
        const v=consumoArea(salPeriodo,a);
        const pct=totalPeriodo>0?Math.round(v/totalPeriodo*100):0;
        const tend=tendencia(a);
        const prom=promedioDiario(a);
        return <div key={a} className="metric">
          <span className="ml">{a}</span>
          <span className="mv" style={{color:areaColors[areasTodas.indexOf(a)%areaColors.length]}}>{v}<small style={{fontSize:12,fontWeight:400,color:'var(--text2)'}}> und</small></span>
          <div style={{marginTop:4}}>
            <div style={{height:4,background:'var(--bg4)',borderRadius:99,overflow:'hidden'}}>
              <div style={{height:'100%',width:`${pct}%`,background:areaColors[areasTodas.indexOf(a)%areaColors.length],borderRadius:99}}/>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:5,fontSize:11}}>
              <span style={{color:'var(--text2)'}}>{pct}% del total</span>
              <span style={{color:tend>0?'var(--red)':tend<0?'var(--green)':'var(--text2)',fontWeight:500}}>
                {tend>0?'↑':tend<0?'↓':'='} {Math.abs(tend)}%
              </span>
            </div>
            <div style={{fontSize:10,color:'var(--text3)',marginTop:3}}>Prom: {prom} /día</div>
          </div>
        </div>;
      })}
      <div className="metric">
        <span className="ml">Total período</span>
        <span className="mv">{totalPeriodo}<small style={{fontSize:12,fontWeight:400,color:'var(--text2)'}}> und</small></span>
        <div style={{fontSize:10,color:'var(--text3)',marginTop:8}}>vs período anterior</div>
        {(()=>{const tA=areas.reduce((t,a)=>t+consumoArea(salPeriodoAnt,a),0);const dif=tA===0?0:Math.round(((totalPeriodo-tA)/tA)*100);return <div style={{fontSize:12,fontWeight:500,color:dif>0?'var(--red)':dif<0?'var(--green)':'var(--text2)'}}>{dif>0?'↑':dif<0?'↓':'='} {Math.abs(dif)}%</div>;})()}
      </div>
    </div>
    
    {/* GRÁFICO COMPARATIVO GENERAL */}
    <div className="chcard">
      <div className="chtitle">Comparativo del período seleccionado</div>
      <BarChartSVG data={areas.map(a=>({q:`${a} (${totalPeriodo>0?Math.round(consumoArea(salPeriodo,a)/totalPeriodo*100):0}%)`,v:consumoArea(salPeriodo,a)}))} color="#4d9eff" height={140}/>
    </div>
    
    {/* EVOLUCIÓN TEMPORAL */}
    <div className="chcard">
      <div className="chrow">
        <div className="chtitle">Evolución últimos 6 meses</div>
        <div className="legend">{areas.map((a,i)=><span key={a}><span className="ldot" style={{background:areaColors[areasTodas.indexOf(a)%areaColors.length]}}/>{a}</span>)}</div>
      </div>
      <svg viewBox="0 0 600 180" style={{width:'100%',height:180}}>
        {mesesEvo.map((m,idx)=>{
          const x=40+idx*((600-60)/Math.max(mesesEvo.length-1,1));
          return <text key={idx} x={x} y={170} fill="var(--text3)" fontSize="10" textAnchor="middle">{m.mes}</text>;
        })}
        {[0,0.25,0.5,0.75,1].map((p,i)=><line key={i} x1="40" x2="580" y1={20+p*120} y2={20+p*120} stroke="var(--border)" strokeWidth="0.5"/>)}
        {areas.map((a,ai)=>{
          const points=mesesEvo.map((m,idx)=>{
            const x=40+idx*((600-60)/Math.max(mesesEvo.length-1,1));
            const y=140-((m[a]||0)/maxMes)*120;
            return `${x},${y}`;
          }).join(' ');
          return <g key={a}>
            <polyline points={points} fill="none" stroke={areaColors[ai%areaColors.length]} strokeWidth="2"/>
            {mesesEvo.map((m,idx)=>{
              const x=40+idx*((600-60)/Math.max(mesesEvo.length-1,1));
              const y=140-((m[a]||0)/maxMes)*120;
              return <circle key={idx} cx={x} cy={y} r="3" fill={areaColors[ai%areaColors.length]}/>;
            })}
          </g>;
        })}
      </svg>
    </div>
    
    {/* DETALLE POR PRODUCTO */}
    <div className="chcard">
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:'1rem',flexWrap:'wrap'}}>
        <div className="chtitle" style={{margin:0}}>Consumo por producto</div>
        <select value={filProd} onChange={e=>setFilProd(e.target.value)} style={{minWidth:200,width:'auto',fontSize:12}}>
          <option value="">Todos los productos</option>
          {products.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}
        </select>
      </div>
      {filProd
        ?<>
          <div style={{display:'grid',gridTemplateColumns:`repeat(${Math.min(areas.length,4)},minmax(0,1fr))`,gap:10,marginBottom:'1rem'}}>
            {areas.map((a,i)=>{
              const v=consumoProdArea(a,parseInt(filProd));
              const totProd=areas.reduce((t,ax)=>t+consumoProdArea(ax,parseInt(filProd)),0);
              const pct=totProd>0?Math.round(v/totProd*100):0;
              return <div key={a} className="metric">
                <span className="ml">{a}</span>
                <span className="mv" style={{color:areaColors[areasTodas.indexOf(a)%areaColors.length]}}>{v}<small style={{fontSize:12,fontWeight:400,color:'var(--text2)'}}> und</small></span>
                <span style={{fontSize:11,color:'var(--text2)'}}>{pct}% del consumo</span>
              </div>;
            })}
          </div>
          <BarChartSVG data={areas.map(a=>({q:a,v:consumoProdArea(a,parseInt(filProd))}))} color="#f0a500" height={120}/>
        </>
        :<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(0,1fr))',gap:16}}>
          {areas.map((a,i)=><div key={a}>
            <div style={{fontSize:11,fontWeight:500,color:areaColors[areasTodas.indexOf(a)%areaColors.length],marginBottom:8,textTransform:'uppercase',letterSpacing:'.05em'}}>{a}</div>
            <BarChartSVG data={consumoAreaPorProd(a).slice(0,8).map(x=>({q:x.n.length>10?x.n.slice(0,10)+'…':x.n,v:x.v}))} color={areaColors[areasTodas.indexOf(a)%areaColors.length]} height={160}/>
          </div>)}
        </div>
      }
    </div>
    
    {/* TOP 5 POR ÁREA */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:12,marginBottom:'1rem'}}>
      {areas.map((a,i)=>{
        const top=top5(a);
        return top.length>0&&<div key={a} className="chcard">
          <div className="chtitle">Top 5 — {a}</div>
          {top.map((p,idx)=>{
            const maxV=top[0].v;
            return <div key={idx} style={{marginBottom:8}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:3}}>
                <span style={{color:'var(--text)',fontWeight:500}}>{p.n.length>22?p.n.slice(0,22)+'…':p.n}</span>
                <span style={{color:areaColors[areasTodas.indexOf(a)%areaColors.length],fontWeight:500,fontFamily:'DM Mono,monospace'}}>{p.v}</span>
              </div>
              <div style={{height:4,background:'var(--bg4)',borderRadius:99,overflow:'hidden'}}>
                <div style={{height:'100%',width:`${Math.round(p.v/maxV*100)}%`,background:areaColors[areasTodas.indexOf(a)%areaColors.length],borderRadius:99}}/>
              </div>
            </div>;
          })}
        </div>;
      })}
    </div>
    
    {/* PRODUCTOS EXCLUSIVOS */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:12}}>
      {areas.map((a,i)=>{
        const exc=exclusivos(a);
        return <div key={a} className="chcard">
          <div className="chtitle">Solo consume {a}</div>
          {exc.length===0
            ?<div style={{fontSize:12,color:'var(--text3)',padding:'8px 0'}}>Sin productos exclusivos en este período</div>
            :<div style={{display:'flex',flexDirection:'column',gap:6}}>
              {exc.slice(0,8).map(p=><div key={p.id} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'4px 0',borderBottom:'1px solid var(--border)'}}>
                <span>{p.nombre.length>26?p.nombre.slice(0,26)+'…':p.nombre}</span>
                <span style={{fontFamily:'DM Mono,monospace',color:areaColors[areasTodas.indexOf(a)%areaColors.length]}}>{consumoProdArea(a,p.id)}</span>
              </div>)}
              {exc.length>8&&<div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>+ {exc.length-8} más</div>}
            </div>
          }
        </div>;
      })}
    </div>
  </>;
}

function Supervision(){
  const {quincenas,ingresos,salidas,actLog,usuariosList,validarQ,rechazarQ,getAnomalias,aprobarIngreso,rechazarIngreso,updateIngreso,aprobarSalida,rechazarSalida,updateSalida,products,isSupervisor}=useApp();

    if(!editVals.cantidad||parseInt(editVals.cantidad)<=0){setEditMsg('Cantidad inválida');return;}
    setSavingEdit(true);
    const err=await updateIngreso(editIng.id,editVals.cantidad,editVals.fecha||editIng.fecha);
    if(err)setEditMsg(err);else{setEditIng(null);setEditMsg('');}
    setSavingEdit(false);
  }
  async function guardarEditSal(){
    if(!editVals.cantidad||parseInt(editVals.cantidad)<=0){setEditMsg('Cantidad inválida');return;}
    setSavingEdit(true);
    const err=await updateSalida(editSal.id,editVals.cantidad,editVals.fecha||editSal.fecha);
    if(err)setEditMsg(err);else{setEditSal(null);setEditMsg('');}

      <button className={`ptab${tab==='ingresos'?' on':''}`} onClick={()=>setTab('ingresos')}>Ingresos {ingresosPend.length>0&&<span style={{background:'var(--green-dim)',color:'var(--green)',fontSize:10,padding:'1px 6px',borderRadius:99,marginLeft:4}}>{ingresosPend.length}</span>}</button>
      <button className={`ptab${tab==='salidas'?' on':''}`} onClick={()=>setTab('salidas')}>Salidas {salidasPend.length>0&&<span style={{background:'var(--red-dim)',color:'var(--red)',fontSize:10,padding:'1px 6px',borderRadius:99,marginLeft:4}}>{salidasPend.length}</span>}</button>
      <button className={`ptab${tab==='anomalias'?' on':''}`} onClick={()=>setTab('anomalias')}>Anomalías {anomalias.length>0&&<span style={{background:'var(--red-dim)',color:'var(--red)',fontSize:10,padding:'1px 6px',borderRadius:99,marginLeft:4}}>{anomalias.length}</span>}</button>
      <button className={`ptab${tab==='log'?' on':''}`} onClick={()=>setTab('log')}>Log</button>
    </div>
    {tab==='conteos'&&<div className="sup-section">
      {pendientes.length===0?<div className="nodata">No hay conteos pendientes de validación ✓</div>
      :<div className="twrap t-sup">
        <div className="thead"><span>Conteo</span><span>Fecha</span><span>Registrado por</span><span>Productos</span><span>Acción</span></div>
        {pendientes.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).map(q=>(
          <div key={q.id} className="trow">
            <span><span className="pname">{q.label}</span></span>
            <span style={{fontSize:12,color:'var(--text2)'}}>{new Date(q.fecha).toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'})}</span>
            <span style={{fontSize:12,color:'var(--blue)'}}>{getNombre(q.created_by)}</span>
            <span className="mono">{Object.keys(q.inventario).length}</span>
            <span style={{display:'flex',gap:4}}><button className="bval" onClick={()=>validarQ(q.id,q.label)}>✓ Validar</button><button className="bdel" style={{padding:'4px 10px',border:'1px solid var(--border2)',borderRadius:4,fontSize:12}} onClick={()=>rechazarQ(q.id,q.label)}>✕ Rechazar</button></span>
          </div>
        ))}
      </div>}
    </div>}
    {tab==='ingresos'&&<div className="sup-section">
      {ingresosPend.length===0?<div className="nodata">No hay ingresos pendientes ✓</div>
      :<div>
        {ingresosPend.map(ig=>{const p=products.find(x=>x.id===ig.product_id);return(

              <span style={{fontWeight:500,fontSize:13}}>{p?.nombre||'—'}</span>
              <span className="mono" style={{color:'var(--green)',fontSize:15,fontWeight:500}}>+{ig.cantidad} <small style={{fontSize:10,color:'var(--text2)'}}>{p?.unidad}</small></span>
            </div>
            <div style={{fontSize:12,color:'var(--text2)'}}>{getNombre(ig.created_by)} · {new Date(ig.fecha).toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'})}</div>
            <div style={{display:'flex',gap:8,marginTop:10}}>
              <button className="bval" onClick={()=>aprobarIngreso(ig.id,p?.nombre,ig.cantidad)}>✓ Aprobar</button>
              <button className="bdel" style={{padding:'4px 12px',border:'1px solid var(--border2)',borderRadius:4,fontSize:12}} onClick={()=>rechazarIngreso(ig.id,p?.nombre,ig.cantidad)}>✕ Rechazar</button>
              <button className="bedit" style={{padding:'4px 10px',border:'1px solid var(--border2)',borderRadius:4,fontSize:12}} onClick={()=>{setEditIng(ig);setEditVals({cantidad:ig.cantidad,fecha:ig.fecha});setEditMsg('');}}>✏️ Editar</button>
            </div>
            {editIng?.id===ig.id&&<div style={{marginTop:8,padding:'10px',background:'var(--bg3)',borderRadius:6}}>
              {editMsg&&<div style={{color:'var(--red)',fontSize:12,marginBottom:6}}>{editMsg}</div>}
              <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
                <div className="field" style={{minWidth:0}}><label>Cantidad</label><input type="number" min="1" value={editVals.cantidad} onChange={e=>setEditVals(v=>({...v,cantidad:e.target.value}))} style={{width:80}}/></div>
                <div className="field" style={{minWidth:0}}><label>Fecha</label><input type="date" value={editVals.fecha} onChange={e=>setEditVals(v=>({...v,fecha:e.target.value}))} style={{width:130}}/></div>
                <button className="bp" style={{fontSize:11,padding:'6px 12px'}} onClick={guardarEditIng} disabled={savingEdit}>{savingEdit?'...':'Guardar'}</button>
                <button className="bs" style={{fontSize:11,padding:'6px 10px'}} onClick={()=>setEditIng(null)}>✕</button>
              </div>
            </div>}
          </div>
        );})}
        <div className="stitle" style={{marginTop:'1.5rem',marginBottom:'.75rem'}}>Historial</div>
        <div className="twrap">
          <div className="thead" style={{gridTemplateColumns:'100px 2fr 80px 90px 120px'}}><span>Fecha</span><span>Producto</span><span>Cant.</span><span>Estado</span><span>Revisado por</span></div>
          {ingresos.filter(ig=>ig.status&&ig.status!=='pending').map(ig=>{const p=products.find(x=>x.id===ig.product_id);return(

              <span style={{fontSize:12,color:'var(--text2)'}}>{new Date(ig.fecha).toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'})}</span>
              <span><span className="pname">{p?.nombre||'—'}</span><span className="pdesc">{getNombre(ig.created_by)}</span></span>
              <span className="mono" style={{color:'var(--green)'}}>+{ig.cantidad}</span>
              <span><span className="badge" style={{background:ig.status==='approved'?'var(--green-dim)':'var(--red-dim)',color:ig.status==='approved'?'var(--green)':'var(--red)'}}>{ig.status==='approved'?'Aprobado':'Rechazado'}</span></span>
              <span style={{fontSize:11,color:'var(--text3)'}}>{ig.reviewed_by||'—'}</span>
            </div>

        </div>

    {tab==='salidas'&&<div className="sup-section">
      {salidasPend.length===0?<div className="nodata">No hay salidas pendientes ✓</div>

            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
              <span style={{fontWeight:500,fontSize:13}}>{p?.nombre||'—'}</span>
              <span className="mono" style={{color:'var(--red)',fontSize:15,fontWeight:500}}>-{sv.cantidad} <small style={{fontSize:10,color:'var(--text2)'}}>{p?.unidad}</small></span>
            </div>
            <div style={{fontSize:12,color:'var(--text2)'}}>{getNombre(sv.created_by)} · {new Date(sv.fecha).toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'})}</div>
            <div style={{display:'flex',gap:8,marginTop:10}}>
              <button className="bval" onClick={()=>aprobarSalida(sv.id,p?.nombre,sv.cantidad)}>✓ Aprobar</button>
              <button className="bdel" style={{padding:'4px 12px',border:'1px solid var(--border2)',borderRadius:4,fontSize:12}} onClick={()=>rechazarSalida(sv.id,p?.nombre,sv.cantidad)}>✕ Rechazar</button>
              <button className="bedit" style={{padding:'4px 10px',border:'1px solid var(--border2)',borderRadius:4,fontSize:12}} onClick={()=>{setEditSal(sv);setEditVals({cantidad:sv.cantidad,fecha:sv.fecha});setEditMsg('');}}>✏️ Editar</button>
            </div>
            {editSal?.id===sv.id&&<div style={{marginTop:8,padding:'10px',background:'var(--bg3)',borderRadius:6}}>
              {editMsg&&<div style={{color:'var(--red)',fontSize:12,marginBottom:6}}>{editMsg}</div>}
              <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
                <div className="field" style={{minWidth:0}}><label>Cantidad</label><input type="number" min="1" value={editVals.cantidad} onChange={e=>setEditVals(v=>({...v,cantidad:e.target.value}))} style={{width:80}}/></div>
                <div className="field" style={{minWidth:0}}><label>Fecha</label><input type="date" value={editVals.fecha} onChange={e=>setEditVals(v=>({...v,fecha:e.target.value}))} style={{width:130}}/></div>
                <button className="bp" style={{fontSize:11,padding:'6px 12px'}} onClick={guardarEditSal} disabled={savingEdit}>{savingEdit?'...':'Guardar'}</button>
                <button className="bs" style={{fontSize:11,padding:'6px 10px'}} onClick={()=>setEditSal(null)}>✕</button>
              </div>
            </div>}
          </div>
        );})}
        <div className="stitle" style={{marginTop:'1.5rem',marginBottom:'.75rem'}}>Historial</div>
        <div className="twrap">
          <div className="thead" style={{gridTemplateColumns:'100px 2fr 80px 90px 120px'}}><span>Fecha</span><span>Producto</span><span>Cant.</span><span>Estado</span><span>Revisado por</span></div>
          {salidas.filter(sv=>sv.status!=='pending').map(sv=>{const p=products.find(x=>x.id===sv.product_id);return(
            <div key={sv.id} className="trow" style={{gridTemplateColumns:'100px 2fr 80px 90px 120px'}}>
              <span style={{fontSize:12,color:'var(--text2)'}}>{new Date(sv.fecha).toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'})}</span>
              <span><span className="pname">{p?.nombre||'—'}</span><span className="pdesc">{sv.created_by}</span></span>
              <span className="mono" style={{color:'var(--red)'}}>-{sv.cantidad}</span>
              <span><span className="badge" style={{background:`${statusColor[sv.status]}22`,color:statusColor[sv.status]}}>{statusLabel[sv.status]}</span></span>
              <span style={{fontSize:11,color:'var(--text3)'}}>{sv.reviewed_by||'—'}</span>
            </div>
          );})}
        </div>
      </div>}
    </div>}
    {tab==='anomalias'&&<div className="sup-section">
      {anomalias.length===0?<div className="nodata">No se detectaron anomalías ✓</div>
      :anomalias.map((a,i)=><div key={i} className="anomaly-card">
        <div className="anomaly-title">⚠️ {a.tipo} — {a.producto}</div>
        <div className="anomaly-desc">{a.detalle}</div>
        <div className="anomaly-meta">Conteo: {a.conteo}</div>
      </div>)}
    </div>}
    {tab==='log'&&<div className="sup-section">
      {actLog.length===0?<div className="nodata">Sin actividad registrada</div>
      :<div className="twrap">
        {actLog.map(l=><div key={l.id} className="log-item">
          <span className="log-time">{new Date(l.created_at).toLocaleDateString('es',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span>
          <span className="log-user">{getNombre(l.user_email)}</span>
          <span className="log-action">{l.accion} — {l.detalle}</span>
        </div>)}
      </div>}
    </div>}
  </div>;
}

  return <div className="page">
    <div className="ph"><div><h1 className="pt">Mis movimientos</h1><p className="ps">Estado de tus registros</p></div></div>
    {(pendQ+pendI+pendS)>0&&<div style={{background:'var(--amber-dim)',border:'1px solid rgba(240,165,0,.2)',borderRadius:'var(--radius)',padding:'10px 16px',marginBottom:'1.25rem',fontSize:13,color:'var(--amber)'}}>
      ⏳ Tienes {pendQ+pendI+pendS} movimiento{pendQ+pendI+pendS>1?'s':''} pendiente{pendQ+pendI+pendS>1?'s':''} de aprobación
    </div>}
    <div className="ptabs">
      <button className={`ptab${tab==='conteos'?' on':''}`} onClick={()=>setTab('conteos')}>Conteos {pendQ>0&&<span style={{background:'var(--amber-dim)',color:'var(--amber)',fontSize:10,padding:'1px 6px',borderRadius:99,marginLeft:4}}>{pendQ}</span>}</button>
      <button className={`ptab${tab==='ingresos'?' on':''}`} onClick={()=>setTab('ingresos')}>Ingresos {pendI>0&&<span style={{background:'var(--amber-dim)',color:'var(--amber)',fontSize:10,padding:'1px 6px',borderRadius:99,marginLeft:4}}>{pendI}</span>}</button>
      <button className={`ptab${tab==='salidas'?' on':''}`} onClick={()=>setTab('salidas')}>Salidas {pendS>0&&<span style={{background:'var(--amber-dim)',color:'var(--amber)',fontSize:10,padding:'1px 6px',borderRadius:99,marginLeft:4}}>{pendS}</span>}</button>
    </div>
    {tab==='conteos'&&<div>
      {misQ.length===0?<div className="nodata">No tienes conteos registrados</div>
      :<div className="twrap">
        <div className="thead" style={{gridTemplateColumns:'80px 1fr 100px'}}><span>Fecha</span><span>Etiqueta</span><span>Estado</span></div>
        {misQ.map(q=><div key={q.id} className="trow" style={{gridTemplateColumns:'80px 1fr 100px'}}>
          <span style={{fontSize:12,color:'var(--text2)'}}>{new Date(q.fecha).toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'})}</span>
          <span className="pname">{q.label}</span>
          <span><span className="badge" style={{background:`${statusColor[q.status||'pending']}22`,color:statusColor[q.status||'pending']}}>{statusLabel[q.status||'pending']}</span></span>
        </div>)}
      </div>}
    </div>}
    {tab==='ingresos'&&<div>
      {misIng.length===0?<div className="nodata">No tienes ingresos registrados</div>
      :<div className="twrap">
        <div className="thead" style={{gridTemplateColumns:'80px 2fr 80px 100px'}}><span>Fecha</span><span>Producto</span><span>Cant.</span><span>Estado</span></div>
        {misIng.map(i=>{const p=products.find(x=>x.id===i.product_id);return(
          <div key={i.id} className="trow" style={{gridTemplateColumns:'80px 2fr 80px 100px'}}>
            <span style={{fontSize:12,color:'var(--text2)'}}>{new Date(i.fecha).toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'})}</span>
            <span><span className="pname">{p?.nombre||'—'}</span></span>
            <span className="mono cg">+{i.cantidad}</span>
            <span><span className="badge" style={{background:`${statusColor[i.status||'approved']}22`,color:statusColor[i.status||'approved']}}>{statusLabel[i.status||'approved']}</span></span>
          </div>
        );})}
      </div>}
    </div>}
    {tab==='salidas'&&<div>
      {misSal.length===0?<div className="nodata">No tienes salidas registradas</div>
      :<div className="twrap">
        <div className="thead" style={{gridTemplateColumns:'80px 2fr 80px 100px'}}><span>Fecha</span><span>Producto</span><span>Cant.</span><span>Estado</span></div>
        {misSal.map(s=>{const p=products.find(x=>x.id===s.product_id);return(
          <div key={s.id} className="trow" style={{gridTemplateColumns:'80px 2fr 80px 100px'}}>
            <span style={{fontSize:12,color:'var(--text2)'}}>{new Date(s.fecha).toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'})}</span>
            <span><span className="pname">{p?.nombre||'—'}</span></span>
            <span className="mono cr">-{s.cantidad}</span>
            <span><span className="badge" style={{background:`${statusColor[s.status]}22`,color:statusColor[s.status]}}>{statusLabel[s.status]}</span></span>
          </div>
        );})}
      </div>}
    </div>}
  </div>;
}

const PAGES_BASE=[{id:'dashboard',label:'Dashboard',icon:'▦'},{id:'inventario',label:'Inventario',icon:'≡'},{id:'control',label:'Control',icon:'⊞'},{id:'ingresos',label:'Ingresos',icon:'↑'},{id:'graficos',label:'Gráficos',icon:'∿'}];
const PAGES_OP=[...PAGES_BASE,{id:'movimientos',label:'Mis movimientos',icon:'◎'}];
const PAGES_SUP=[...PAGES_BASE,{id:'supervision',label:'Supervisión',icon:'◈'}];

function AppMain({user,profile,isSupervisor,onLogout}){
  const [page,setPage]=useState('dashboard');
  const userName=profile?.nombre||user.email;
  return(<Store user={user} userEmail={user.email} isSupervisor={isSupervisor} onLogout={onLogout}>
    <AppInner page={page} setPage={setPage} onLogout={onLogout} userName={userName} isSupervisor={isSupervisor}/>
  </Store>);
}

function AppInner({page,setPage,onLogout,userName,isSupervisor}){
  const {getEstado,products,csvInventario,loading,error,quincenas,salidas,ingresos,userEmail}=useApp();
  const nc=products.filter(p=>getEstado(p.id)==='critico').length;
  const misPend=(ingresos||[]).filter(i=>i.created_by===userEmail&&i.status==='pending').length+(salidas||[]).filter(s=>s.created_by===userEmail&&s.status==='pending').length+(quincenas||[]).filter(q=>q.created_by===userEmail&&(!q.status||q.status==='pending')).length;
  const pendientes=quincenas.filter(q=>!q.status||q.status==='pending').length;
  const salPend=salidas?salidas.filter(s=>s.status==='pending').length:0;
  const ingPend=ingresos?ingresos.filter(i=>i.status==='pending').length:0;
  const totalPend=pendientes+salPend+ingPend;
  const PAGES=isSupervisor?PAGES_SUP:PAGES_OP;
  if(loading)return <div className="loading"><div className="spinner"/><span style={{fontSize:13,color:'var(--text2)'}}>Cargando inventario...</span></div>;
  if(error)return <div className="loading"><span style={{fontSize:14,color:'var(--red)'}}>Error: {error}</span><button className="bs" style={{marginTop:8}} onClick={()=>window.location.reload()}>Reintentar</button></div>;
  return <div className="app">
    <aside className="sidebar">
      <div className="brand">
        <span className="brand-icon">⬡</span><span className="brand-name">Inventario</span>
        <span className={`rol-badge ${isSupervisor?'rol-sup':'rol-op'}`}>{isSupervisor?'Sup.':'Op.'}</span>
      </div>
      <nav className="nav">
        {PAGES.map(p=><button key={p.id} className={`nav-btn${page===p.id?' active':''}`} onClick={()=>setPage(p.id)}>
          <span className="nav-icon">{p.icon}</span><span>{p.label}</span>
          {p.id==='dashboard'&&nc>0&&<span className="nbadge">{nc}</span>}
          {p.id==='movimientos'&&misPend>0&&<span className="nbadge" style={{background:'var(--amber)'}}>{misPend}</span>}
          {p.id==='supervision'&&totalPend>0&&<span className="nbadge" style={{background:'var(--amber)'}}>{totalPend}</span>}
        </button>)}
      </nav>
      <div className="sidebar-foot">
        <div className="user-info"><span className="user-dot"/><span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{userName}</span></div>
        <button className="bexp" onClick={csvInventario}>↓ Exportar CSV</button>
        <button className="bexp" onClick={onLogout}>Cerrar sesión</button>
      </div>
    </aside>
    <main className="main">
      {page==='dashboard'&&<Dashboard/>}
      {page==='inventario'&&<Inventario/>}
      {page==='control'&&<Control/>}
      {page==='ingresos'&&<Ingresos/>}
      {page==='graficos'&&<Graficos/>}
      {page==='movimientos'&&!isSupervisor&&<MisMovimientos/>}
      {page==='supervision'&&isSupervisor&&<Supervision/>}
    </main>
    <nav className="bottom-nav">
      {PAGES.map(p=><button key={p.id} className={`bnbtn${page===p.id?' on':''}`} onClick={()=>setPage(p.id)}>
        <div style={{position:'relative',display:'inline-block'}}>
          <span className="bnico">{p.icon}</span>
          {p.id==='dashboard'&&nc>0&&<span className="bnbadge">{nc}</span>}
          {p.id==='movimientos'&&misPend>0&&<span className="bnbadge" style={{background:'var(--amber)'}}>{misPend}</span>}
          {p.id==='supervision'&&totalPend>0&&<span className="bnbadge" style={{background:'var(--amber)'}}>{totalPend}</span>}
        </div>
        <span className="bnlbl">{p.label}</span>
      </button>)}
    </nav>
  </div>;
}

function Root(){
  const [usuario,setUsuario]=useState(undefined);

  useEffect(()=>{
    const saved=sessionStorage.getItem('inv_usuario');
    if(saved){try{setUsuario(JSON.parse(saved));}catch(e){setUsuario(null);}}
    else{setUsuario(null);}
  },[]);

  function handleLogin(data){
    sessionStorage.setItem('inv_usuario',JSON.stringify(data));
    setUsuario(data);
  }
  function handleLogout(){
    sessionStorage.removeItem('inv_usuario');
    setUsuario(null);
  }

  if(usuario===undefined)return <div className="loading"><div className="spinner"/></div>;
  if(!usuario)return <AuthScreen onLogin={handleLogin}/>;

  // Simula los mismos objetos que AppMain esperaba antes
  const fakeUser={email:usuario.dni,id:usuario.dni};
  const fakeProfile={nombre:usuario.nombre,status:'approved'};
  const isSupervisor=usuario.cargo==='supervisor';
  return <AppMain user={fakeUser} profile={fakeProfile} isSupervisor={isSupervisor} onLogout={handleLogout}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
